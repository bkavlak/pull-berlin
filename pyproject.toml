[project]
name = "pull-berlin"
version = "0.1.0"
description = "Catalog of Berlin spaces (evening/night event venues first) on a BFO/CCO ontological foundation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.4.6"]

[project.scripts]
pull-berlin = "pull_berlin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "rdflib>=7",
    "pyshacl>=0.26",
    "owlready2>=0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pull_berlin"]

[tool.uv]
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "unit: pure, no I/O, only fakes and fixtures",
    "integration: one adapter against a real local dependency",
    "e2e: whole pipeline against recorded sources",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["pull_berlin"]

[[tool.mypy.overrides]]
module = ["laya", "laya.*"]
ignore_missing_imports = true
