# Publishes the map to GitHub Pages: catalog snapshot + every human review -> _site/.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Map on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/catalog/**"
      - "data/reviews/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Publish map data (snapshot + reviews)
        run: |
          uv sync --no-dev
          uv run pull-berlin review check
          uv run pull-berlin publish --out _site/data
      - name: Add the map page
        run: cp web/index.html web/filters.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
